<!doctype html>
<html lang="zh-CN" data-family="magazine" data-medium="page" data-theme="ink-classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歸藏工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="gz-magazine.css">
<link rel="stylesheet" href="style.css">
<script>
  // 跟随系统深色：深色时用午夜墨
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'midnight-ink'
</script>
</head>
<body>
<main class="studio">
  <header class="masthead">
    <span class="mh-name">歸藏工作室</span>
    <span class="mh-sep">·</span>
    <span>Guizang Studio</span>
    <span class="mh-sep">·</span>
    <span id="mh-count">—</span>
  </header>

  <section class="hero">
    <h1>做过的，都在这里</h1>
    <p class="lead">网页 PPT、图文卡片、网页排版、去 AI 味，四个 skill 共用一套设计系统。点一下，在新对话里接着做。</p>
  </section>

  <section class="block" id="start">
    <div class="block-head"><span class="num">01</span><h2>开始</h2></div>
    <div class="skills" id="skills"></div>
  </section>

  <section class="block" id="works">
    <div class="block-head"><span class="num">02</span><h2>我的作品</h2><div class="filters" id="work-filters"></div></div>
    <div class="columns" id="column-list"></div>
    <div class="grid" id="work-grid"></div>
  </section>

  <section class="block" id="voice">
    <div class="block-head"><span class="num">03</span><h2>我的语气</h2><p class="block-note">从你写过的文章和对话里的修改意见学来的写作习惯。写文案、讲稿、卡片标题之前，各个 skill 都会先读它。档案只存在这台电脑上。</p></div>
    <div class="voice" id="voice-box"></div>
  </section>

  <section class="block" id="recipes">
    <div class="block-head"><span class="num">04</span><h2>配方</h2><p class="block-note">跨 skill 的常用组合，草稿填好，补上内容就能发。</p></div>
    <div class="recipes" id="recipe-list"></div>
  </section>

  <section class="block" id="examples">
    <div class="block-head"><span class="num">05</span><h2>官方示例</h2><div class="filters" id="example-filters"></div></div>
    <div class="grid" id="example-grid"></div>
  </section>

  <footer class="foot">歸藏工作室 · 设计系统 guizang-design · <span id="foot-sources"></span></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
